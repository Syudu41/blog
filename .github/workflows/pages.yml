name: Check and deploy blog

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'tasks/**'
      - 'scripts/**'
      - 'tensorquill/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'tasks/**'
      - 'scripts/**'
      - 'tensorquill/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install website dependencies
        run: python -m pip install -r website/requirements.txt
      - name: Test rendering and publication workflows
        run: python -m unittest discover -s tests
      - name: Build website with Sphinx and Furo
        run: python scripts/website.py build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
