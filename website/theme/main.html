<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | e }} | {{ config.site_name | e }}</title>
  <link rel="stylesheet" href="{{ 'assets/gallery.css' | url }}">
  <link rel="canonical" href="{{ page.canonical_url | e }}">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header>
    <div class="wrapper header-inner">
      <a class="site-title" href="{{ config.site_url | replace('/samples/', '/') }}">Agent</a>
      <nav aria-label="Main navigation">
        <a href="{{ config.site_url | replace('/samples/', '/') }}">About</a>
        <a href="{{ '.' | url }}"{% if page.is_homepage %} aria-current="page"{% endif %}>Sample visualizations</a>
      </nav>
    </div>
  </header>
  <main id="content" class="wrapper">
    {% block content %}{{ page.content }}{% endblock %}
  </main>
</body>
</html>
